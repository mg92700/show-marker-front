name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les seuils de couverture (90 %) sont définis dans angular.json
      - run: npx ng test --watch=false --coverage
      - run: npx ng build
